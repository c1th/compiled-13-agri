[project]
name = "penumbra"
version = "0.1.0"
description = "Calibrated empirical model of cross-species RNAi non-target risk"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas",
    "numpy",
    "scikit-learn",
    "statsmodels",
    "biopython",
    "requests",
    "fastapi",
    "uvicorn",
    "reportlab",
    "matplotlib",
    "pybloom-live",
    "torch>=2.13.0",
    "rna-fm>=0.2.2",
    "huggingface-hub>=1.24.0",
    "transformers>=5.14.1",
    "pymc>=5.28.5",
    "arviz>=0.23.4",
]

[project.optional-dependencies]
rna = ["viennarna"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["corpus", "hazard", "exposure", "design", "compare", "report", "api", "embed"]
