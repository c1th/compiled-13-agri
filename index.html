<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FieldLoop</title>
  <link rel="stylesheet" href="vendor/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">FieldLoop</div>
    <div class="field-meta">
      <span id="field-name" class="field-name">&mdash;</span>
      <span id="field-date" class="field-date">&mdash;</span>
      <a class="btn nav-btn" href="drones.html">Drone ops &rarr;</a>
    </div>
  </header>

  <main class="layout">
    <section class="panel map-panel">
      <div class="panel-title">Field map &mdash; treatment intensity</div>
      <form class="search-bar" id="search-form" autocomplete="off">
        <input id="search-input" class="inv-input search-input" type="text"
               placeholder="Search a place, or type coordinates as lat, lon">
        <button type="submit" class="btn">Go</button>
        <span id="search-status" class="search-status"></span>
      </form>
      <div class="map-toolbar">
        <button id="draw-region" class="btn">Add region</button>
        <button id="clear-regions" class="btn">Clear</button>
        <label class="field-label" for="band-select">View</label>
        <select id="band-select" class="inv-input band-select"></select>
        <button id="gee-connect" class="btn">Connect Earth Engine</button>
        <span id="map-status" class="map-status"></span>
      </div>
      <p class="band-note" id="band-note"></p>
      <div id="gee-map" class="gee-map"></div>
      <div class="band-scale" id="band-scale" hidden></div>
      <div class="map-legend" id="map-legend"></div>
      <div class="region-list" id="region-list"></div>
      <div class="region-readout num" id="region-readout"></div>
      <p class="provenance">
        Treating only diagnosed pest zones is validated against Iowa State
        (76% avg field-area savings) and Univ. of Arkansas (43&ndash;59%)
        precision-spray trials.
      </p>
    </section>

    <section class="panel breakdown-panel">
      <div class="panel-title">Recommended distribution</div>
      <div id="breakdown-body"></div>
    </section>

    <section class="panel analyze-panel">
      <div class="analyze-bar">
        <button id="run-analysis" class="btn btn-primary">Run analysis</button>
        <span id="analyze-status" class="analyze-status"></span>
        <a id="drone-cta" class="btn nav-btn" href="drones.html" hidden>Continue to drone operations &rarr;</a>
      </div>
    </section>

    <section class="panel procure-panel">
      <div class="panel-title">Procurement</div>
      <div id="procure-body"></div>
    </section>
  </main>

  <script src="vendor/leaflet.js"></script>
  <script src="vendor/ee_api_js.js"></script>
  <script src="js/config.js"></script>
  <script src="data/stub-zones.js"></script>
  <script src="data/zones.js"></script>
  <script src="data/catalog.js"></script>
  <script src="js/weighted-map.js"></script>
  <script src="js/breakdown.js"></script>
  <script src="js/field-map.js"></script>
  <script src="js/geemap.js"></script>
  <script src="js/analyze.js"></script>
  <script src="js/procure.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
